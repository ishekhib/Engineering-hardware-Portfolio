<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ibrahim Shekhibrahim</title>
<meta name="description" content="Portfolio of Ibrahim Shekhibrahim, Electrical Engineering and AI Systems student at Western University." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#4a525c;
  --text:#EDEFF2;
  --muted:#C6CDD4;
  --faint:#A2ACB6;
  --accent:#A6C6DC;
  --stroke:rgba(255,255,255,.12);
  --stroke-2:rgba(255,255,255,.20);
  --glass:rgba(255,255,255,.06);
  --glass-2:rgba(255,255,255,.10);
  --display:'Archivo',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:rgba(166,198,220,.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* background */
#board{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(74,82,92,0) 35%,rgba(50,56,64,.6) 100%);
}

main{position:relative;z-index:2}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 26px}
.section{padding:110px 0}

h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.06;margin:0}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:38px}

.glass{
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 22px 50px -32px rgba(0,0,0,.6);
}

/* nav */
.nav{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:2px;padding:6px 7px;border-radius:999px;
  background:rgba(62,70,80,.6);border:1px solid var(--stroke);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px -26px rgba(0,0,0,.6);
}
.nav a{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:8px 15px;border-radius:999px;white-space:nowrap;
  transition:color .25s var(--ease),background .25s var(--ease);
}
.nav a:hover{color:var(--text);background:var(--glass-2)}

/* hero */
.hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:120px 26px 90px;position:relative;
}
.avatar{
  width:190px;height:190px;border-radius:50%;padding:5px;margin-bottom:32px;
  background:var(--glass);border:1px solid var(--stroke-2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 60px -30px rgba(0,0,0,.6);
}
.avatar img,.avatar .ph{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .ph{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#5a636e,#4a525c);
  font-family:var(--display);font-size:2rem;color:var(--faint);
}
.hero h1{font-size:clamp(2.6rem,8vw,5.4rem);line-height:.95;margin-bottom:20px}
.hero .role{
  font-family:var(--mono);font-size:clamp(10.5px,1.5vw,12.5px);
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 9px;
}
.hero .school{color:var(--muted);font-size:14.5px;margin:0 0 38px}

.actions{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:999px;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  transition:transform .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease);
}
.btn:hover{transform:translateY(-2px);background:var(--glass-2);border-color:var(--stroke-2)}
.btn svg{width:15px;height:15px;opacity:.8}
.btn--icon{padding:13px}
.btn--icon svg{width:17px;height:17px}

/* project photo reel behind avatar */
.reel-row{position:relative;margin-bottom:32px}
.reel-row .avatar{margin-bottom:0;position:relative;z-index:1}
.reel{
  position:absolute;top:0;left:50%;width:100vw;height:190px;
  transform:translateX(-50%);overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
}
.reel-track{display:flex;height:100%;width:max-content;animation:reel 60s linear infinite}
.reel-track img{
  height:100%;width:auto;max-width:none;aspect-ratio:4/3;object-fit:cover;
  margin-right:14px;border-radius:16px;border:1px solid var(--stroke);opacity:.45;
}
@keyframes reel{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* project cards — title only */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{
